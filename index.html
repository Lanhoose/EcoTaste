<!-- index.html-->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTaste - Vitrine com Consumo de Dados e Erros</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <header class="header-main">
        <div class="container header-content">
            <h1>EcoTaste</h1>
            <div class="cart-status" aria-live="polite">
                🛒 <span id="cart-count">0</span> itens | R$ <span id="cart-total">0.00</span>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="vitrine-section">
            <h2>Produtos Orgânicos Disponíveis</h2>

            <!-- ÁREA DE FEEDBACK VISUAL (LOADING / ERRO) -->
            <div id="status-feedback" class="status-container" aria-live="assertive"></div>

            <!-- CONTAINER ONDE OS PRODUTOS SERÃO INJETADOS -->
            <div id="vitrine" class="grid-produtos"></div>
        </section>
    </main>

    <script src="./js/app.js"></script>
</body>
</html>
